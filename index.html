<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- The page talks only to the server it came from (a second layer under
         the request guard in src/tracking/net-guard.js). -->
    <meta http-equiv="Content-Security-Policy" content="connect-src 'self' blob: data:" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Window</title>
    <meta name="description" content="Your screen becomes a window: the camera follows your eye and the scene is drawn from where you are." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='5' width='26' height='22' rx='3' fill='none' stroke='%23ededee' stroke-width='2.5'/%3E%3Cpath d='M9 22l5-6 4 4 5-7' fill='none' stroke='%239cc0ff' stroke-width='2.5' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; background: #000; }
      /* Scene changes fade through black (animated by the compositor, so it
         keeps going while a new scene compiles). Starts black. */
      #fade { position: fixed; inset: 0; background: #000; opacity: 1; pointer-events: none; transition: opacity 0.4s ease; }
      #fatal, #notice { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #ededee; font: 14px/1.5 -apple-system, system-ui, sans-serif; max-width: 420px; text-align: center; }
    </style>
  </head>
  <body>
    <canvas id="view" aria-label="Scene seen through the window"></canvas>
    <div id="fade" aria-hidden="true"></div>
    <div id="ui" class="ui"></div>
    <p id="fatal" role="alert" hidden></p>
    <p id="notice" role="alert" hidden></p>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
